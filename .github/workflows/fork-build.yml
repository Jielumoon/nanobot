name: Fork build

# 仅在推送版本 tag（如 v0.4.1-fork.1）时构建并发布；推送分支不再触发。
# 也可在 Actions 页面手动运行：在 tag 上运行会发布，在分支上运行只构建并上传产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并校验安装包
    if: github.repository == 'Jielumoon/nanobot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: 校验 tag 与源码版本一致
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == f"v{version}" or tag.startswith(f"v{version}-"), (
              f"tag {tag} 与 pyproject.toml 版本 {version} 不一致，应为 v{version} 或 v{version}-<后缀>"
          )
          print(f"tag {tag} 对应源码版本 {version}")
          PY
      - name: 构建包含 WebUI 的 wheel
        run: uv build --wheel --out-dir dist
      - name: 校验源码提交与完整 WebUI 资产
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          import zipfile
          from pathlib import Path

          from scripts.verify_installed_release import webui_assets

          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              commit = archive.read("nanobot/_build_commit.txt").decode().strip()
              assert commit == os.environ["EXPECTED_COMMIT"], f"源码提交不匹配：{commit}"
              with tempfile.TemporaryDirectory() as directory:
                  archive.extractall(directory)
                  assets = webui_assets(Path(directory) / "nanobot/web/dist")
          print(f"已校验 {wheel.name}：源码提交 {commit}，WebUI 资产 {len(assets)} 个")
          PY
          cd dist
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fork-package
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: 发布 tag 对应的预发布版本
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fork-package
          path: dist
      - name: 校验下载的安装包
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: 发布 Fork Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS \
            --verify-tag \
            --title "Fork build ${TAG}" \
            --prerelease --latest=false \
            --notes "版本 tag：${TAG}，源码提交：${SOURCE_COMMIT}。包含 WebUI，不内置原生 TUI。仅供手动安装，不属于官方签名更新源。安装包沿用源码版本号；同版本更新需显式重装，并核验安装后的源码提交。下载后使用 SHA256SUMS 校验文件完整性。"
